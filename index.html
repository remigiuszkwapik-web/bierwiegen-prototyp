
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiegen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .font-bungee {
            font-family: 'Bungee', cursive;
        }
        .beer-gradient {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
        }
        @keyframes floatUp {
          0% { transform: translateY(0) scale(1); opacity: 0; }
          10% { opacity: 1; }
          100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }
        :root { --ac: #f59e0b; --ac-h: #fbbf24; --ac-s: rgba(245,158,11,0.25); }
        .ac-bg   { background-color: var(--ac) !important; }
        .ac-bg:hover { background-color: var(--ac-h) !important; }
        .ac-text { color: var(--ac) !important; }
        .ac-border { border-color: var(--ac) !important; }
        .ac-shadow { box-shadow: 0 10px 25px -5px var(--ac-s) !important; }
        .ac-ring:focus { outline: none; box-shadow: 0 0 0 2px var(--ac) !important; }
        .ac-bg-10 { background-color: var(--ac10) !important; }
        .ac-bg-20 { background-color: var(--ac20) !important; }
        .ac-border-30 { border-color: var(--ac30) !important; }
        @keyframes waveMove1 {
          0%   { transform: translateX(0); }
          100% { transform: translateX(-25%); }
        }
        @keyframes waveMove2 {
          0%   { transform: translateX(-10%); }
          100% { transform: translateX(-35%); }
        }
        @keyframes waveMove3 {
          0%   { transform: translateX(-5%); }
          100% { transform: translateX(-30%); }
        }
        @keyframes bubbleRise {
          0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
          10%  { opacity: 1; }
          50%  { transform: translateY(-45vh) translateX(8px) scale(1.05); }
          90%  { opacity: 0.6; }
          100% { transform: translateY(-100vh) translateX(-4px) scale(0.8); opacity: 0; }
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
