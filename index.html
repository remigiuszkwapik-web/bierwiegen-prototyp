
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiegen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // amber-400/-500 zeigen auf CSS-Variablen, damit das Farbschema des
        // gewählten Getränks zur Laufzeit alle Akzentfarben umfärbt.
        tailwind.config = {
            theme: { extend: { colors: { amber: {
                400: 'rgb(var(--ac-400) / <alpha-value>)',
                500: 'rgb(var(--ac-500) / <alpha-value>)',
            } } } }
        };
    </script>
    <link rel="preload" href="./fonts/inter-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/bungee-latin.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        /* Schriften liegen lokal unter /fonts – kein Request an Google, und die
           App bleibt auch ohne Netz lesbar. Inter ist ein Variable Font und
           deckt 400–800 in einer Datei ab, inkl. 700 für font-bold.
           unicode-range sorgt dafür, dass latin-ext nur geladen wird, wenn
           tatsächlich ein Zeichen daraus vorkommt (z. B. polnische Namen). */
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 400 800;
            font-display: swap;
            src: url('./fonts/inter-variable-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 400 800;
            font-display: swap;
            src: url('./fonts/inter-variable-latin-ext.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        @font-face {
            font-family: 'Bungee';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('./fonts/bungee-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Bungee';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('./fonts/bungee-latin-ext.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .no-scrollbar { scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .font-bungee {
            font-family: 'Bungee', cursive;
        }
        .beer-gradient {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
        }
        @keyframes floatUp {
          0% { transform: translateY(0) scale(1); opacity: 0; }
          10% { opacity: 1; }
          100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }
        :root { --ac-500: 245 158 11; --ac-400: 251 191 36; --ac: rgb(var(--ac-500)); --ac-h: rgb(var(--ac-400)); --ac-s: rgb(var(--ac-500) / 0.25); }
        .ac-bg   { background-color: var(--ac) !important; }
        .ac-bg:hover { background-color: var(--ac-h) !important; }
        .ac-text { color: var(--ac) !important; }
        .ac-border { border-color: var(--ac) !important; }
        .ac-shadow { box-shadow: 0 10px 25px -5px var(--ac-s) !important; }
        .ac-ring:focus { outline: none; box-shadow: 0 0 0 2px var(--ac) !important; }
        @keyframes waveMove1 {
          0%   { transform: translateX(0); }
          100% { transform: translateX(-25%); }
        }
        @keyframes waveMove2 {
          0%   { transform: translateX(-10%); }
          100% { transform: translateX(-35%); }
        }
        @keyframes waveMove3 {
          0%   { transform: translateX(-5%); }
          100% { transform: translateX(-30%); }
        }
        @keyframes bubbleRise {
          0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
          10%  { opacity: 1; }
          50%  { transform: translateY(-45vh) translateX(8px) scale(1.05); }
          90%  { opacity: 0.6; }
          100% { transform: translateY(-100vh) translateX(-4px) scale(0.8); opacity: 0; }
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
